name: finch
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.11,<3.14
  - anyascii >=0.3.0
  - birdy >=0.8.1
  - ipython >=8.5.0
  - matplotlib-base >=3.5.0
  - nbsphinx >=0.9.8
  - pandas >=2.2.0,<3.0
  - pywps >=4.5.1
  - setuptools >=71.0.0
  - sphinx >=7.0.0
  - sphinxcontrib-bibtex >=2.6.0
  - xarray >=2023.11.0
  - xclim >=0.61,<0.62 # remember to match xclim version in environment.yml and pyproject.toml as well
