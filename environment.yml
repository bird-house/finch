name: finch
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python >=3.11,<3.15
  - pip >=26.1.0
  - anyascii >=0.3.0
  - cftime >=1.4.1
  - cf_xarray >=0.9.3
  - click >=8.1.7
  - clisops >=0.16.2,!=0.18.0
  - dask >=2023.5.1
  - distributed
  - geopandas >=1.0
  - jinja2 >=3.1.4
  - netcdf4
  - numpy >=1.25.0
  - pandas >=2.2.0,<3.0
  - parse >=1.20
  - psutil >=6.0.0
  - python-slugify >=8.0
  - pywps >=4.6
  - pyyaml >=6.0.1
  - scipy >=1.9.0
  - sentry-sdk
  - setuptools >=78.1.1
  - siphon >=0.10.0
  - werkzeug >=3.0.6
  - xarray >=2023.11.0
  - xclim >=0.61,<0.62 # remember to match xclim version in pyproject.toml as well
  - xesmf >=0.8.2,!=0.8.8
  - xsdba >=0.6,<0.7   # remember to match xsdba version in pyproject.toml as well
  - xscen >=0.15,<0.16  # remember to match xscen version in pyproject.toml as well
  # Temporary fixes
  - fastprogress <1.1  # FIXME: Temporary fix following https://github.com/intake/intake-esm/pull/773. Remove when intake-esm is updated in xscen.
  # Dev
  - birdy >=0.8.1
  - black >=26.1.0
  - bump-my-version >=1.2.6
  - coverage >=7.5.0
  - cruft >=2.15.0
  - flake8 >=7.3.0
  - flake8-rst-docstrings >=0.4.0
  - flit >=3.11.0,<4.0
  - geojson
  - nbsphinx >=0.9.8
  - nbval >=0.10.0
  - owslib
  - pip >=25.3.0
  - pre-commit >=3.5.0
  - pylint >=3.3.3
  - pytest >=8.0.0
  - pytest-cov >=5.0.0
  - ruff >=0.14.0
  - watchdog >=4.0.0
  - yamllint >=1.26.0
  # Docs
  - ipython >=8.5.0
  - matplotlib-base >=3.5.0
  - sphinx >=9.0.0
  - sphinxcontrib-bibtex >=2.6.0
